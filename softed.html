<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>정렬 알고리즘</title>
    <style>
      * {
        box-sizing: border-box;
      }

      html,
      body {
        width: 100%;
        height: 100%;
        margin: 0;
        background: #fff;
      }

      body {
        display: grid;
        place-items: center;
        overflow: hidden;
      }

      .picture {
        position: relative;
        display: grid;
        grid-template-columns: repeat(100, minmax(0, 1fr));
        width: min(88vw, 420px);
        aspect-ratio: 1;
      }

      .slice {
        position: relative;
        grid-row: 1;
        width: 100%;
        height: 100%;
        background-image: url("https://github.com/ssoggycat.png");
        background-repeat: no-repeat;
        background-size: 10000% 100%;
        background-position: var(--image-position) center;
      }

      .slice.is-red {
        z-index: 1;
        outline: 2px solid rgb(0, 255, 0);
      }

      .picture.is-complete::before {
        position: absolute;
        z-index: 2;
        inset: 0;
        background-image: url("https://github.com/ssoggycat.png");
        background-size: 100% 100%;
        content: "";
        pointer-events: none;
        animation: white-flash 900ms ease-out both;
      }

      .picture.is-complete::after {
        position: absolute;
        z-index: 3;
        inset: -12%;
        border-radius: 50%;
        background: radial-gradient(circle, rgb(255 255 255 / 95%), rgb(255 255 255 / 50%) 38%, transparent 72%);
        content: "";
        pointer-events: none;
        animation: flash-burst 900ms ease-out both;
      }

      .particle {
        position: absolute;
        z-index: 4;
        top: 50%;
        left: 50%;
        width: var(--size);
        height: var(--size);
        border-radius: 50%;
        background: #fff;
        box-shadow: 0 0 8px 3px rgb(255 255 255 / 100%), 0 0 18px 7px rgb(210 235 255 / 90%);
        pointer-events: none;
        animation: particle-burst 1000ms ease-out both;
      }

      @keyframes white-flash {
        0%, 100% { filter: brightness(1); }
        20% { filter: brightness(3); }
        55% { filter: brightness(1.8); }
      }

      @keyframes flash-burst {
        0% { opacity: 0; transform: scale(.2); }
        25% { opacity: 1; transform: scale(1); }
        100% { opacity: 0; transform: scale(1.5); }
      }

      @keyframes particle-burst {
        0% { opacity: 1; transform: translate(-50%, -50%) scale(.6); }
        100% {
          opacity: 0;
          transform: translate(calc(-50% + var(--x)), calc(-50% + var(--y))) scale(0);
        }
      }

    </style>
  </head>
  <body>
    <script>
  if (navigator.userAgent === "Screenjesus") {
    document.body.innerHTML = '<img src="/img/your-cover.png" style="width:100vw;height:100vh;object-fit:cover;">';
  }
</script>
    <div>
      <main class="picture" aria-label="버블 정렬 애니메이션"></main>
      <select class="algorithm" id="algorithm">
        <option value="merge">Merge Sort</option>
        <option value="quick">Quick Sort</option>
        <option value="insertion">Insertion Sort</option>
        <option value="bubble">Bubble Sort</option>
      </select>
      <button class="sort" type="button">정렬</button>
      <button class="shuffle" type="button">섞기</button>
      <button class="stop" type="button" disabled>정렬 멈춤</button>
    </div>
    <script>
      const picture = document.querySelector(".picture");
      const sortButton = document.querySelector(".sort");
      const stopButton = document.querySelector(".stop");
      const shuffleButton = document.querySelector(".shuffle");
      const algorithmSelect = document.querySelector(".algorithm");
      const sliceCount = 100;
      const slices = Array.from({ length: sliceCount }, (_, index) => {
        const slice = document.createElement("span");
        slice.className = "slice";
        slice.dataset.imageIndex = String(index);
        slice.style.setProperty("--image-position", `${(index / (sliceCount - 1)) * 100}%`);
        picture.append(slice);
        return slice;
      });
      const order = [...slices];
      const wait = () => new Promise((resolve) => setTimeout(resolve, 1));
      let stopRequested = false;
      let shuffledSinceSort = false;
      let audioContext;
      let lastToneTime = 0;
      let completionTimeout;

      function placeSlices(order) {
        order.forEach((slice, slot) => {
          slice.style.gridColumn = String(slot + 1);
        });
      }

      function valueOf(slice) {
        return Number(slice.dataset.imageIndex);
      }

      function isSorted() {
        return order.every((slice, index) => valueOf(slice) === index);
      }

      function clearCompletionEffect() {
        window.clearTimeout(completionTimeout);
        picture.classList.remove("is-complete");
        picture.querySelectorAll(".particle").forEach((particle) => particle.remove());
      }

      function showCompletionEffect() {
        clearCompletionEffect();
        void picture.offsetWidth;
        picture.classList.add("is-complete");

        for (let index = 0; index < 36; index++) {
          const angle = Math.random() * Math.PI * 2;
          const distance = 55 + Math.random() * 150;
          const particle = document.createElement("span");
          particle.className = "particle";
          particle.style.setProperty("--x", `${Math.cos(angle) * distance}px`);
          particle.style.setProperty("--y", `${Math.sin(angle) * distance}px`);
          particle.style.setProperty("--size", `${3 + Math.random() * 7}px`);
          picture.append(particle);
        }

        completionTimeout = window.setTimeout(clearCompletionEffect, 1100);
      }

      function playSortTone(value) {
        if (!audioContext || audioContext.state !== "running") return;
        const now = audioContext.currentTime;
        if (now - lastToneTime < 0.025) return;
        lastToneTime = now;

        const oscillator = audioContext.createOscillator();
        const gain = audioContext.createGain();
        oscillator.frequency.value = 220 + (value / (sliceCount - 1)) * 660;
        gain.gain.setValueAtTime(0.3, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.04);
        oscillator.connect(gain);
        gain.connect(audioContext.destination);
        oscillator.addEventListener("ended", () => {
          oscillator.disconnect();
          gain.disconnect();
        }, { once: true });
        oscillator.start(now);
        oscillator.stop(now + 0.04);
      }

      function shuffle() {
        if (shuffledSinceSort) return;
        clearCompletionEffect();
        slices.forEach((slice) => slice.classList.remove("is-red"));
        for (let index = order.length - 1; index > 0; index--) {
          const otherIndex = Math.floor(Math.random() * (index + 1));
          [order[index], order[otherIndex]] = [order[otherIndex], order[index]];
        }
        if (order.every((slice, index) => Number(slice.dataset.imageIndex) === index)) {
          [order[0], order[1]] = [order[1], order[0]];
        }
        placeSlices(order);
        shuffledSinceSort = true;
        shuffleButton.disabled = true;
        sortButton.disabled = isSorted();
      }

      async function markAndWait(slice) {
        slice.classList.add("is-red");
        playSortTone(valueOf(slice) + 1);
        await wait();
        slice.classList.remove("is-red");
      }

      async function bubbleSort() {
        for (let end = order.length - 1; end > 0; end--) {
          if (stopRequested) return;
          let swapped = false;
          for (let index = 0; index < end; index++) {
            await markAndWait(order[index]);
            if (stopRequested) return;
            if (valueOf(order[index]) > valueOf(order[index + 1])) {
              [order[index], order[index + 1]] = [order[index + 1], order[index]];
              placeSlices(order);
              swapped = true;
            }
          }
          if (!swapped) return;
        }
      }

      async function insertionSort() {
        for (let index = 1; index < order.length; index++) {
          if (stopRequested) return;
          const current = order[index];
          let position = index - 1;
          while (position >= 0 && valueOf(order[position]) > valueOf(current)) {
            await markAndWait(order[position]);
            if (stopRequested) break;
            order[position + 1] = order[position];
            placeSlices(order);
            position--;
          }
          order[position + 1] = current;
          placeSlices(order);
          if (stopRequested) return;
          await wait();
        }
      }

      async function mergeSort(start, end) {
        if (stopRequested || start >= end) {
          return;
        }
        const middle = Math.floor((start + end) / 2);
        await mergeSort(start, middle);
        if (stopRequested) return;
        await mergeSort(middle + 1, end);
        if (stopRequested) return;

        const left = order.slice(start, middle + 1);
        const right = order.slice(middle + 1, end + 1);
        let leftIndex = 0;
        let rightIndex = 0;
        let target = start;

        while (leftIndex < left.length && rightIndex < right.length) {
          const next = valueOf(left[leftIndex]) <= valueOf(right[rightIndex])
            ? left[leftIndex++]
            : right[rightIndex++];
          await markAndWait(next);
          order[target++] = next;
          placeSlices(order);
        }
        while (leftIndex < left.length) {
          order[target++] = left[leftIndex++];
          placeSlices(order);
          await wait();
        }
        while (rightIndex < right.length) {
          order[target++] = right[rightIndex++];
          placeSlices(order);
          await wait();
        }
      }

      async function quickSort(low, high) {
        if (stopRequested || low >= high) {
          return;
        }
        const pivotValue = valueOf(order[high]);
        let pivotIndex = low;
        for (let scan = low; scan < high; scan++) {
          await markAndWait(order[scan]);
          if (stopRequested) return;
          if (valueOf(order[scan]) < pivotValue) {
            if (pivotIndex !== scan) {
              [order[pivotIndex], order[scan]] = [order[scan], order[pivotIndex]];
              placeSlices(order);
              await wait();
            }
            pivotIndex++;
          }
        }
        [order[pivotIndex], order[high]] = [order[high], order[pivotIndex]];
        placeSlices(order);
        await wait();
        await quickSort(low, pivotIndex - 1);
        await quickSort(pivotIndex + 1, high);
      }

      async function animateSort() {
        if (isSorted()) {
          sortButton.disabled = true;
          return;
        }
        clearCompletionEffect();
        stopRequested = false;
        sortButton.disabled = true;
        shuffleButton.disabled = true;
        algorithmSelect.disabled = true;
        stopButton.disabled = false;
        try {
          const AudioContextClass = window.AudioContext || window.webkitAudioContext;
          if (AudioContextClass) {
            try {
              if (!audioContext) {
                audioContext = new AudioContextClass();
              }
              if (audioContext.state === "suspended") {
                await audioContext.resume();
              }
            } catch (error) {
              console.error("정렬 소리를 시작하지 못했습니다.", error);
              audioContext = undefined;
            }
          }
          if (algorithmSelect.value === "bubble") {
            await bubbleSort();
          } else if (algorithmSelect.value === "insertion") {
            await insertionSort();
          } else if (algorithmSelect.value === "merge") {
            await mergeSort(0, order.length - 1);
          } else {
            await quickSort(0, order.length - 1);
          }
        } finally {
          slices.forEach((slice) => slice.classList.remove("is-red"));
          const completed = isSorted();
          sortButton.disabled = completed;
          shuffledSinceSort = false;
          shuffleButton.disabled = false;
          algorithmSelect.disabled = false;
          stopButton.disabled = true;
          if (completed) {
            showCompletionEffect();
          }
        }
      }

      placeSlices(order);
      sortButton.disabled = isSorted();
      sortButton.addEventListener("click", animateSort);
      stopButton.addEventListener("click", () => {
        stopRequested = true;
        stopButton.disabled = true;
      });
      shuffleButton.addEventListener("click", () => {
        if (!shuffleButton.disabled) {
          shuffle();
        }
      });
    </script>
  </body>
</html>
